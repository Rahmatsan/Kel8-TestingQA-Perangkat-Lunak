name: Capture GPX public screenshots
on:
  push:
    paths:
      - '.github/workflows/capture-gpx-public.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Capture public login via headless Chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          echo "Chrome: $CHROME"
          mkdir -p "Hasil-Dokumentasi testing/screenshots"
          curl --fail --location --silent --show-error --max-time 35 "https://gudangpembangunan.up.railway.app/login" -o /tmp/gpx-login.html
          OUTPUT="Hasil-Dokumentasi testing/screenshots"
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --disable-dev-shm-usage --virtual-time-budget=12000 --window-size=1365,900 --user-data-dir=/tmp/gpx-browser-desktop --screenshot="$OUTPUT/GPX-LOGIN-public-desktop.png" "https://gudangpembangunan.up.railway.app/login" || true
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --disable-dev-shm-usage --virtual-time-budget=12000 --window-size=390,844 --user-agent="Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Mobile Safari/537.36" --user-data-dir=/tmp/gpx-browser-mobile --screenshot="$OUTPUT/GPX-LOGIN-public-mobile.png" "https://gudangpembangunan.up.railway.app/login" || true
          test -s "$OUTPUT/GPX-LOGIN-public-desktop.png"
          test -s "$OUTPUT/GPX-LOGIN-public-mobile.png"
          file "$OUTPUT"/*.png
      - name: Commit screenshots into repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Hasil-Dokumentasi testing/screenshots/GPX-LOGIN-public-desktop.png" "Hasil-Dokumentasi testing/screenshots/GPX-LOGIN-public-mobile.png"
          if ! git diff --cached --quiet; then
            git commit -m "Bukti visual halaman Login GPX [skip ci]"
            git push
          fi
